  - generic [ref=f3e62]:
    - generic [ref=f3e64]:
      - heading "Codex Pesticides Residues in Food Online Database" [level=1] [ref=f3e65]
      - paragraph [ref=f3e66]:
        - text: This database contains Codex Maximum Residue Limits for Pesticides and Extraneous Maximum Residue Limits adopted by the Codex Alimentarius Commission up to and including its 48
        - superscript [ref=f3e67]: th
        - text: Session (November 2025).
      - paragraph [ref=f3e68]
      - paragraph [ref=f3e69]: In the data base a user can obtain information on Codex Maximum Residue Limits (MRLs) and Codex Extraneous Maximum Residue Limits (EMRLs) for pesticide / commodity combinations. Names and definitions of commodities are found in the Codex Classification of Foods and Animal Feeds.
      - paragraph [ref=f3e70]: The foods listed shall not contain more than the MRL or EMRL (in mg/kg) of the pesticide residue (defined in each individual case in the definition of residue) at (a) the point of entry into a country or (b) at the point of entry into trade channels within a country. This maximum limit shall not be exceeded at any time thereafter.
      - paragraph [ref=f3e71]: The MRLs and EMRLs apply to the residue content of the final sample representative of the lot and of the portion of commodities which is analyzed.
      - paragraph [ref=f3e72]:
        - text: Up to 2025 the Codex Alimentarius Commission has adopted
        - strong [ref=f3e73]: 6522 MRLs and 63 EMRLs (CXLs)
        - text: for different combinations of pesticide/commodity(ies).
      - blockquote [ref=f3e74]:
        - paragraph [ref=f3e75]:
          - generic [ref=f3e76]: 
          - text: When searching MRLs for single commodity (e.g. FC 0204 Lemon), please also search MRLs for the corresponding subgroups (e.g. FC 0002 Lemons and Limes) and the corresponding groups (e.g. FC 0001 Citrus Fruits) in order to have the whole spectrum of the Codex MRLs for the commodity.
